[project]
name = "luoshu-bot"
version = "1.0.0"
description = "洛书 bot - 基于 nonebot2 的 QQ 群机器人"
authors = []
readme = "README.md"

[tool.nonebot]
adapters = [
    { name = "OneBot V11", module_name = "nonebot.adapters.onebot.v11" },
]
plugins = []
plugin_dirs = ["src/plugins"]

[build-system]
requires = ["poetry_core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
